# Render Deployment Blueprint for Last Chance
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: last-chance-app
    env: python
    region: oregon
    plan: starter
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/time
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: last-chance-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DEFAULT_THEME
        value: dark
    disk:
      name: last-chance-uploads
      mountPath: /opt/render/project/src/uploads
      sizeGB: 5

databases:
  - name: last-chance-db
    region: oregon
    plan: starter
    databaseName: lastchance
    user: lastchance_user
