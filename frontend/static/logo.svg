<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="lcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="lcCheckGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
    <filter id="lcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4F46E5" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield / Frame -->
  <rect x="3" y="3" width="42" height="42" rx="12" fill="url(#lcGrad)" filter="url(#lcGlow)"/>
  
  <!-- Geometric Forward Arc / Pathway Motif -->
  <path d="M 12 33 C 12 21, 21 12, 33 12" stroke="rgba(255, 255, 255, 0.3)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Stylized Dynamic Checkmark & Progress Arrow Combined -->
  <!-- Checkmark root to apex -->
  <path d="M 14 26 L 22 34 L 36 17" stroke="url(#lcCheckGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Ascending Forward Spark / Target Dot -->
  <circle cx="36" cy="13" r="2.5" fill="#38BDF8"/>
</svg>
